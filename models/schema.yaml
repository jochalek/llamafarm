title: LlamaFarm Model Definitions
type: array
items:
  type: object
  required:
    - alias
    - provider
    - model
  properties:
    alias:
      type: string
      description: Unique identifier (e.g., "fast", "creative") used to select this model.
    display_name:
      type: ["string", "null"]
      description: Human-friendly name for UIs.
    description:
      type: ["string", "null"]
      description: Additional details about when to use this model.
    provider:
      type: string
      enum: [openai, ollama]
    model:
      type: string
      description: Provider-specific model name or ID.
    base_url:
      type: ["string", "null"]
      description: Base URL for provider requests (e.g., custom Ollama host).
    api_key:
      type: ["string", "null"]
      description: API key (optional, not required for local providers).
    instructor_mode:
      type: ["string", "null"]
      description: Preferred instructor mode when structured output is supported.
    agent_handler:
      type: ["string", "null"]
      enum: [simple_chat, simple_rag, structured_rag, classifier]
      default: structured_rag
      description: Chat orchestration pipeline associated with this model.
    default:
      type: boolean
      default: false
      description: Marks this entry as the default model when none is specified.
    model_api_parameters:
      type: ["object", "null"]
      description: Additional parameters passed to the provider when creating completions.
      additionalProperties: true
