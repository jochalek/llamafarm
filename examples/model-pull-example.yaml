version: v1
name: model-pull-example
namespace: default

runtime:
  default_model: gemma-4b

  models:
    - name: gemma-4b
      description: "Google Gemma 3 4B model with Q4_0 quantization"
      provider: lemonade
      model: user.gemma-3-4b-it
      prompt_format: unstructured

      # Model pull configuration - used by 'lf models pull'
      # This makes it easy to download/pull the model with all the right settings
      model_info:
        checkpoint: google/gemma-3-4b-it-qat-q4_0-gguf
        variant: Q4_0
        recipe: llamacpp
        reasoning: false

      # Lemonade runtime configuration
      lemonade:
        backend: llamacpp
        port: 11534
        context_size: 32768

    - name: qwen-vision
      description: "Qwen 2.5 VL 7B vision model"
      provider: lemonade
      model: Qwen2.5-VL-7B-Instruct-GGUF
      prompt_format: image
      vision: true

      # For registered Lemonade models, model_info can be minimal or omitted
      model_info:
        recipe: llamacpp

      lemonade:
        backend: llamacpp
        port: 11535  # Different port for multi-instance
        context_size: 65536

      vision_config:
        max_tokens: 1024
        temperature: 0.1
        resize_images: true
        max_dimension: 768
        max_image_size_kb: 500

    - name: fast-ollama
      description: "Fast Ollama model for quick responses"
      provider: ollama
      model: gemma3:1b
      base_url: http://localhost:11434/v1
      prompt_format: unstructured

      # For Ollama models, model_info just needs the model name
      # Use: lf models pull gemma3:1b --provider ollama
      model_info: null  # Ollama pulls don't need extra config

prompts:
  - role: system
    content: "You are a helpful AI assistant."

# To pull models:
# lf models pull user.gemma-3-4b-it --provider lemonade --checkpoint google/gemma-3-4b-it-qat-q4_0-gguf --variant Q4_0 --recipe llamacpp
# OR if model_info is configured in the config, you can reference it programmatically
