runtime:
  default_model: fast
  models:
  - name: fast
    description: Fast Qwen3-4B Instruct model (Q4 quantization, no thinking)
    provider: ollama
    model: qwen3-4b-instruct
    base_url: http://localhost:11434/v1
    prompt_format: unstructured
    provider_config: {}
  - name: lemon
    description: Lemonade runtime with Qwen model
    provider: lemonade
    model: Qwen3-0.6B-GGUF
    provider_config:
      backend: llamacpp
      port: 11534
      context_size: 32768
      auto_download: false
  - name: balanced
    description: Balanced Lemonade model for FDA analysis (4B)
    provider: lemonade
    model: user.Qwen3-4B-GGUF
    provider_config:
      backend: llamacpp
      port: 11536
      context_size: 32768
      auto_download: false
  - name: lemon_fast
    description: Lemonade runtime with Qwen model
    provider: lemonade
    model: Qwen2.5-VL-7B-Instruct-GGUF
    provider_config:
      backend: llamacpp
      port: 11535
      context_size: 32768
